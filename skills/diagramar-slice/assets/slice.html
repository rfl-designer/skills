body {

.arquivo:hover { box-shadow: 0 2px 10px var(--sombra); }
.arquivo[data-status="contexto"] { border-style: dashed; border-left-style: solid; color: var(--suave); background: transparent; }
.arquivo-nome { font: 600 0.9rem/1.3 var(--f-mono); overflow-wrap: anywhere; }
.arquivo-pasta { color: var(--suave); font: 0.75rem/1.3 var(--f-mono); overflow-wrap: anywhere; }

dialog.modal {

.modal-caixa { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.modal-topo {

  padding: 0.85rem 1rem;

.modal-titulo { display: flex; align-items: flex-start; gap: 0.6rem; min-width: 0; }
.modal-titulo h2 { margin: 0; font: 600 1rem/1.35 var(--f-mono); overflow-wrap: anywhere; }

.modal-acoes { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem; }

.posicao { min-width: 4.5rem; text-align: center; color: var(--suave); font-size: 0.85rem; }
.visao { display: inline-flex; border: 1px solid var(--linha); border-radius: 6px; overflow: hidden; margin: 0; padding: 0; }
.visao legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.visao label { position: relative; padding: 0.3rem 0.7rem; cursor: pointer; font-size: 0.85rem; background: var(--codigo); }
.visao label + label { border-left: 1px solid var(--linha); }
.visao input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.visao label:has(input:checked) { background: var(--moldura); color: var(--slice); }
.visao label:has(input:focus-visible) { outline: 2px solid var(--destaque); outline-offset: -2px; }

.modal-corpo { flex: 1; min-height: 0; overflow: auto; padding: 0.75rem 1rem 1.25rem; display: grid; align-content: start; gap: 0.75rem; }
.nota-modal {

.nota-modal.corte { border-color: var(--alterado); background: var(--aviso); }

.diff {

.diff td { padding: 0 0.5rem; vertical-align: top; }
.diff .num {

.diff .num::before { content: attr(data-n); }

.diff .cod::before { content: attr(data-sinal); display: inline-block; width: 1.1em; margin-left: -0.15em; color: var(--suave); user-select: none; }
.diff tr.l-add td, .diff td.l-add { background: var(--add); }
.diff tr.l-add .num, .diff .num.l-add { background: var(--add-num); }
.diff tr.l-del td, .diff td.l-del { background: var(--del); }
.diff tr.l-del .num, .diff .num.l-del { background: var(--del-num); }

# Regras padrão. A primeira regra que combina com o caminho define a camada.
Testes: (^|/)(tests?|__tests__|spec|e2e|cypress)/|[._-](test|spec)\.[A-Za-z0-9]+$|(^|/)test_[^/]+\.py$|Test\.php$
Interface: (^|/)(resources/(views|js|css|sass|scss)|app/(Livewire|View)|lang|components|pages|views|layouts|public|assets|styles?)/|\.(blade\.php|vue|svelte|jsx|tsx|css|scss|sass|less|html?)$
API: (^|/)(routes|app/Http|app/Console|api|[Cc]ontrollers?|graphql)/|\.(graphql|proto)$|(^|/)openapi\.(ya?ml|json)$
Domínio: (^|/)(app/(Models|Actions|Services|Domain|Domains|Policies|Events|Listeners|Jobs|Mail|Notifications|Rules|Enums|Data|DTOs?|Observers|Exceptions|Support)|domain|services|models|entities)/
Dados: (^|/)(database|migrations?|seeders?|factories|db|prisma)/|\.(sql|sqlite)$

<script id="nucleo">
(function (raiz) {
  'use strict';
  var LIMITE = 3000;
  var ORDEM = ['Interface', 'API', 'Domínio', 'Dados', 'Testes'];
  var OUTROS = 'Outros';
  var HUNK = /^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@(.*)$/;
  var ESCAPES = { a: 7, b: 8, t: 9, n: 10, v: 11, f: 12, r: 13, '"': 34, '\\': 92 };

  function tirarAspas(texto) {
    if (texto.length < 2 || texto[0] !== '"' || texto[texto.length - 1] !== '"') return texto;
    var bytes = [];
    var trecho = '';
    var corpo = texto.slice(1, -1);
    var codificador = new TextEncoder();
    function despejar() {
      codificador.encode(trecho).forEach(function (b) { bytes.push(b); });
      trecho = '';
    }
    for (var i = 0; i < corpo.length; i++) {
      if (corpo[i] !== '\\') { trecho += corpo[i]; continue; }
      despejar();
      var octal = /^[0-7]{1,3}/.exec(corpo.slice(i + 1, i + 4));
      if (octal) { bytes.push(parseInt(octal[0], 8)); i += octal[0].length; continue; }
      var letra = corpo[i + 1];
      if (letra !== undefined && Object.prototype.hasOwnProperty.call(ESCAPES, letra)) bytes.push(ESCAPES[letra]);
      else trecho += letra || '';
      i++;
    }
    despejar();
    return new TextDecoder('utf-8').decode(new Uint8Array(bytes));
  }

  function lerToken(texto) {
    if (texto[0] !== '"') return null;
    for (var i = 1; i < texto.length; i++) {
      if (texto[i] === '\\') { i++; continue; }
      if (texto[i] === '"') return [tirarAspas(texto.slice(0, i + 1)), texto.slice(i + 1)];
    }
    return null;
  }

  function semPrefixo(caminho) {
    return /^[ab]\//.test(caminho) ? caminho.slice(2) : caminho;
  }

  function caminhoDoCabecalho(valor) {
    var token = lerToken(valor);
    var caminho = token ? token[0] : valor.split('\t')[0];
    return caminho === '/dev/null' ? null : semPrefixo(caminho);
  }

  function caminhosDoDiffGit(resto) {
    var a;
    var b;
    var primeiro = lerToken(resto);
    if (primeiro) {
      var sobra = primeiro[1].replace(/^ /, '');
      var segundo = lerToken(sobra);
      a = primeiro[0];
      b = segundo ? segundo[0] : sobra;
    } else if (/"$/.test(resto) && resto.lastIndexOf(' "') > 0) {
      var aspas = resto.lastIndexOf(' "');
      a = resto.slice(0, aspas);
      b = tirarAspas(resto.slice(aspas + 1));
    } else {
      var meio = (resto.length - 1) / 2;
      if (resto[meio] === ' ' && resto.slice(2, meio) === resto.slice(meio + 3)) {
        a = resto.slice(0, meio);
        b = resto.slice(meio + 1);
      } else {
        var corte = resto.indexOf(' b/');
        a = corte > 0 ? resto.slice(0, corte) : resto;
        b = corte > 0 ? resto.slice(corte + 1) : resto;
      }
    }
    return [semPrefixo(a), semPrefixo(b)];

      else if (linha.indexOf('new mode ') === 0) atual.depois = linha.slice(9).trim();

  function lerRegras(texto) {

    var erros = [];

      var fonte = corte > 0 ? linha.slice(corte + 1).trim() : '';

        return;
      }

        regras.push({ camada: camada, re: new RegExp(fonte), fonte: fonte });
      } catch (erro) {

  }

  function classificar(caminho, regras) {
    for (var i = 0; i < regras.length; i++) {
      if (regras[i].re.test(caminho)) return regras[i].camada;
    }

  }

  function ordenarCamadas(regras) {

    });

  function lerConteudo(conteudo) {

  function comparar(a, b) {

    var noDiff = new Set(arquivos.map(function (arquivo) { return arquivo.caminho; }));
    var contexto = (dados.contexto || []).filter(function (item) {

    });
    var camadas = ordenarCamadas(lidas.regras).map(function (nome) { return { nome: nome, arquivos: [] }; });

    arquivos.forEach(function (arquivo) { arquivo.camada = camadaDe(arquivo).nome; camadaDe(arquivo).arquivos.push(arquivo); });
    contexto.forEach(function (arquivo) { arquivo.camada = camadaDe(arquivo).nome; camadaDe(arquivo).arquivos.push(arquivo); });

    });

      arquivos: navegacao,
      total: arquivos.length,
      contexto: contexto.length,

<script>
(function () {
  'use strict';
  var S = window.Slice;
  var ROTULOS = { novo: 'Novo', alterado: 'Alterado', removido: 'Removido', renomeado: 'Renomeado', contexto: 'Sem mudança' };
  var LETRAS = { novo: 'A', alterado: 'M', removido: 'D', renomeado: 'R' };
  var OPCOES = '-M --no-color --no-ext-diff --src-prefix=a/ --dst-prefix=b/';
  var CHAVE_VISAO = 'diagramar-slice:visao';
  var $ = function (id) { return document.getElementById(id); };
  var modal = $('modal');
  var dados = JSON.parse($('dados').textContent);
  var padrao = $('camadas-padrao').textContent;
  var estado = { slice: null, indice: -1, origem: null, visao: lerVisao(), ignorarHash: null };

  function esc(texto) {
    return String(texto).replace(/[&<>"']/g, function (c) {

    });
  }
  function plural(n, um, varios) { return n.toLocaleString('pt-BR') + ' ' + (n === 1 ? um : varios); }
  function shell(texto) { return /^[A-Za-z0-9._\/@^~:=+-]+$/.test(texto) ? texto : "'" + texto.replace(/'/g, "'\\''") + "'"; }
  function intervalo() { return shell(dados.base) + '...' + shell(dados.alvo); }

  function lerVisao() {
    try {
      var salva = localStorage.getItem(CHAVE_VISAO);
      if (salva === 'lado' || salva === 'linha') return salva;
    } catch (erro) { /* armazenamento indisponível */ }
    return window.innerWidth >= 900 ? 'lado' : 'linha';
  }
  function gravarVisao(visao) {
    try { localStorage.setItem(CHAVE_VISAO, visao); } catch (erro) { /* armazenamento indisponível */ }
  }

  function renderizar() {
    var s = estado.slice = S.montarSlice(dados, padrao);
    document.title = 'Slice ' + dados.nome;
    $('nome').textContent = dados.nome;
    $('intervalo').textContent = dados.base + '...' + dados.alvo;
    $('total').textContent = plural(s.total, 'arquivo', 'arquivos') + (s.contexto ? ' + ' + plural(s.contexto, 'de contexto', 'de contexto') : '');
    var legenda = ['novo', 'alterado', 'removido', 'renomeado'].map(function (status) {
      return '<li data-status="' + status + '"><span class="letra">' + LETRAS[status] + '</span>' + ROTULOS[status] + ' ' + s.contagem[status] + '</li>';
    });
    if (s.contexto) legenda.push('<li data-status="contexto"><span class="letra">·</span>Sem mudança ' + s.contexto + '</li>');
    $('legenda').innerHTML = legenda.join('');
    var erros = $('erros-regras');
    erros.hidden = !s.erros.length;
    erros.innerHTML = s.erros.length ? '<strong>Regras de camada ignoradas:</strong><ul>' + s.erros.map(function (erro) {

    }).join('') + '</ul>' : '';

      return;
    }
    area.innerHTML = '<div class="diagrama" role="list">' + s.camadas.map(function (camada) {
      var itens = camada.arquivos.map(cartao).join('');
      return '<div class="faixa" role="listitem"><div class="rotulo"><span class="rotulo-nome">' + esc(camada.nome) + '</span>' +
        '<span class="rotulo-qtd">' + plural(camada.arquivos.length, 'arquivo', 'arquivos') + '</span></div>' +
        '<div class="celula">' + (itens ? '<ul class="arquivos">' + itens + '</ul>' : '<p class="sem-arquivos">Sem arquivos nesta camada.</p>') + '</div>' +
        '<div aria-hidden="true"></div></div>';

  }

  function cartao(arquivo) {

    else {
      meta = '<span class="letra">' + LETRAS[arquivo.status] + '</span>';
      if (arquivo.binario) meta += '<span>binário</span>';

    }
    return '<li><button type="button" class="arquivo" data-status="' + arquivo.status + '" data-indice="' + arquivo.indice + '" title="' + esc(arquivo.caminho) + '"' +
      ' aria-label="' + esc(arquivo.caminho + ', ' + ROTULOS[arquivo.status].toLowerCase()) + '">' +
      '<span class="arquivo-nome">' + esc(nome) + '</span>' + (pasta ? '<span class="arquivo-pasta">' + esc(pasta) + '</span>' : '') +

  }

  function nota(html, classe) { return '<p class="nota-modal' + (classe ? ' ' + classe : '') + '">' + html + '</p>'; }
  function comando(texto) {
    return '<span class="comando"><code>' + esc(texto) + '</code><button type="button" class="botao-leve copiar" data-copiar="' + esc(texto) + '">Copiar</button></span>';
  }

  function corpoDoDiff(arquivo) {
    var partes = [];
    if (arquivo.binario) return nota('Arquivo binário: sem diff de texto.');
    if (arquivo.modo) partes.push(nota('Permissão alterada: <code>' + esc(arquivo.modo.antes) + '</code> → <code>' + esc(arquivo.modo.depois) + '</code>.'));
    if (arquivo.cortado) {
      var caminhos = (arquivo.caminhoAntigo ? shell(arquivo.caminhoAntigo) + ' ' : '') + shell(arquivo.caminho);
      partes.push(nota('O diff deste arquivo tem mais de ' + S.LIMITE.toLocaleString('pt-BR') + ' linhas. A tela mostra as primeiras ' +
        S.LIMITE.toLocaleString('pt-BR') + '. Para ver o diff completo, execute:' + comando('git diff ' + OPCOES + ' ' + intervalo() + ' -- ' + caminhos), 'corte'));

  function classeDe(tipo) { return tipo === '+' ? 'l-add' : tipo === '-' ? 'l-del' : 'l-ctx'; }

  }

  function tabelaLinha(arquivo) {

    });

    return html.join('');
  }

  function tabelaLado(arquivo) {
    var html = ['<table class="diff lado"><colgroup><col class="c-num"><col><col class="c-num"><col></colgroup><tbody>'];
    function lado(linha, numero) {

        }

        adicionadas = [];

      hunk.linhas.forEach(function (linha) {

        if (linha.tipo === '\\') { html.push('<tr class="l-nota"><td></td><td colspan="3">' + esc(linha.texto) + '</td></tr>'); return; }
        html.push('<tr>' + lado(linha, linha.a) + lado(linha, linha.b).replace('<td class="num', '<td class="meio num') + '</tr>');
      });
      despejar();
    });
    html.push('</tbody></table>');
    return html.join('');
  }

  function corpoDoContexto(arquivo) {
    if (arquivo.binario) return nota('Arquivo binário: sem conteúdo de texto.');
    var partes = [nota('Arquivo sem mudança na branch. A tela mostra o conteúdo em <code>' + esc(dados.alvo) + '</code>.')];
    if (arquivo.cortado) {
      partes.push(nota('O arquivo tem mais de ' + S.LIMITE.toLocaleString('pt-BR') + ' linhas. A tela mostra as primeiras ' +
        S.LIMITE.toLocaleString('pt-BR') + '. Para ver o arquivo completo, execute:' + comando('git show ' + shell(dados.alvo + ':' + arquivo.caminho)), 'corte'));
    }
    var html = ['<table class="diff"><colgroup><col class="c-num"><col></colgroup><tbody>'];
    arquivo.linhas.forEach(function (texto, i) {
      html.push('<tr class="l-ctx">' + num(i + 1) + codigo({ tipo: ' ', texto: texto }) + '</tr>');
    });

  }

  function mostrarArquivo() {

  function botaoDo(indice) { return document.querySelector('.arquivo[data-indice="' + indice + '"]'); }

  function abrir(indice, origem) {

    if (modal.open && destino >= 0 && destino < estado.slice.arquivos.length) abrir(destino);
  }
  function fechar() { if (modal.open) modal.close(); }

  function codificar(caminho) { return encodeURIComponent(caminho).replace(/%2F/g, '/'); }
  function lerHash() {
    var achado = /^#file=(.*)$/.exec(location.hash);
    if (!achado) return null;
    try { return decodeURIComponent(achado[1]); } catch (erro) { return achado[1]; }
  }
  function trocarHash(novo) {
    if (location.hash === novo || (!novo && !location.hash)) return;
    try {
      history.replaceState(null, '', novo || location.pathname + location.search);
    } catch (erro) {
      estado.ignorarHash = novo;
      location.hash = novo;
    }
  }
  function gravarHash(caminho) { trocarHash('#file=' + codificar(caminho)); }
  function abrirPeloHash() {
    var caminho = lerHash();
    if (caminho === null) { fechar(); return; }
    var lista = estado.slice ? estado.slice.arquivos : [];
    for (var i = 0; i < lista.length; i++) {
      if (lista[i].caminho === caminho) { abrir(i); return; }
    }
  }

  function copiar(botao) {
    var texto = botao.dataset.copiar || ($(botao.dataset.copiarDe) || {}).textContent || '';
    function selecionar() {
      var alvo = botao.previousElementSibling;
      var faixa = document.createRange();
      faixa.selectNodeContents(alvo);
      var selecao = window.getSelection();
      selecao.removeAllRanges();
      selecao.addRange(faixa);
      botao.textContent = 'Selecionado';
    }
    try {
      navigator.clipboard.writeText(texto).then(function () { botao.textContent = 'Copiado'; }, selecionar);
    } catch (erro) {
      selecionar();
    }
  }

  document.addEventListener('click', function (evento) {
    var arquivo = evento.target.closest('.arquivo');
    if (arquivo) { abrir(+arquivo.dataset.indice, arquivo); return; }
    var botao = evento.target.closest('.copiar');
    if (botao) copiar(botao);
  });
  $('anterior').addEventListener('click', function () { mover(-1); });
  $('proximo').addEventListener('click', function () { mover(1); });
  $('fechar').addEventListener('click', fechar);
  modal.addEventListener('click', function (evento) { if (evento.target === modal) fechar(); });
  document.addEventListener('keydown', function (evento) {
    if (!modal.open || evento.altKey || evento.ctrlKey || evento.metaKey || evento.shiftKey) return;
    var alvo = evento.target;
    if (alvo && (/^(INPUT|SELECT|TEXTAREA)$/.test(alvo.tagName) || alvo.isContentEditable)) return;
    if (evento.key === 'ArrowLeft') { evento.preventDefault(); mover(-1); }
    if (evento.key === 'ArrowRight') { evento.preventDefault(); mover(1); }
  });
  modal.addEventListener('close', function () {
    trocarHash('');
    var origem = estado.origem && document.contains(estado.origem) ? estado.origem : botaoDo(estado.indice);
    estado.origem = null;
    if (origem) origem.focus();
  });
  $('visao').addEventListener('change', function (evento) {
    estado.visao = evento.target.value;
    gravarVisao(estado.visao);
    if (modal.open) mostrarArquivo();
  });
  window.addEventListener('hashchange', function () {
    if (estado.ignorarHash !== null && location.hash === estado.ignorarHash) { estado.ignorarHash = null; return; }
    estado.ignorarHash = null;
    abrirPeloHash();
  });

  if (dados.modo === 'artefato') {
    var colar = $('colar');
    var campoBase = $('campo-base');
    var campoAlvo = $('campo-alvo');
    var atualizarComando = function () {
      var base = campoBase.value.trim() || 'main';
      var alvo = campoAlvo.value.trim() || 'HEAD';
      $('comando-colar').textContent = 'git diff ' + OPCOES + ' ' + shell(base) + '...' + shell(alvo);
    };
    colar.hidden = false;
    campoBase.value = dados.base;
    campoAlvo.value = dados.alvo;
    atualizarComando();
    campoBase.addEventListener('input', atualizarComando);
    campoAlvo.addEventListener('input', atualizarComando);
    $('form-colar').addEventListener('submit', function (evento) {
      evento.preventDefault();
      var texto = $('campo-diff').value;
      var mensagem = $('mensagem-colar');
      var quantos = S.lerDiff(texto).length;
      if (!quantos) {
        mensagem.textContent = 'Sem diferenças: o texto não tem arquivos de diff. Confira se colou a saída completa do comando.';
        return;
      }
      var base = campoBase.value.trim() || 'base';
      var alvo = campoAlvo.value.trim() || 'alvo';
      fechar();
      dados = { modo: 'artefato', nome: alvo, base: base, alvo: alvo, diff: texto, contexto: [], camadas: dados.camadas, fonteCamadas: dados.fonteCamadas };
      renderizar();
      mensagem.textContent = 'Slice gerada com ' + plural(quantos, 'arquivo', 'arquivos') + '.';
    });
  }

  renderizar();
  abrirPeloHash();
})();
</script>
